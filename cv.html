<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Marcin Jędrzejak, iOS Developer</title>
  <meta name="description"
    content="CV Marcina Jędrzejaka, iOS Developera: SwiftUI, aplikacje w App Store, doświadczenie i certyfikaty.">
  <link rel="icon" type="image/jpeg" href="./assets/avatar.jpg">
  <link rel="apple-touch-icon" href="./assets/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    /* Apply the saved theme before the first paint so the page never flashes. */
    try {
      const t = localStorage.getItem('mj-theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
  </script>
  <style>
    :root {
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --ink: #1D1D1F;
      --ink-soft: #6E6E73;
      --line: #E5E5E2;
      --swift: #FA7343;
      --swift-strong: #D9551F;
      --swift-tint: #FFF1EA;
      --swift-tint-line: #FFDCC7;
      --tag-bg: #F1F1EF;
      --raised: #EFEFEC;
      --nav-bg: rgba(247, 247, 245, 0.85);
    }

    html[data-theme="dark"] {
      --bg: #121214;
      --surface: #1B1B1E;
      --ink: #F2F2F2;
      --ink-soft: #9B9BA1;
      --line: #2C2C30;
      --swift: #FF8A5C;
      --swift-strong: #FF8A5C;
      --swift-tint: #2A1D16;
      --swift-tint-line: #4A2E1C;
      --tag-bg: #232326;
      --raised: #17171A;
      --nav-bg: rgba(18, 18, 20, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    h1,
    h2,
    h3 {
      font-family: 'Sora', sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul,
    ol {
      list-style: none;
    }

    svg {
      flex-shrink: 0;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* NAV (same as the home page) */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: block;
      object-fit: cover;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 14px;
      font-weight: 500;
      flex: 1;
    }

    .nav-links a {
      color: var(--ink-soft);
      transition: color .2s;
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      transition: background .2s, transform .15s;
    }

    .toggle-btn:hover {
      transform: translateY(-1px);
    }

    .toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    .lang-btn {
      width: auto;
      padding: 0 12px;
    }

    .nav-cta {
      background: var(--ink);
      color: var(--bg) !important;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-cta svg {
      width: 14px;
      height: 14px;
    }

    @media (max-width:760px) {
      .nav-links {
        display: none;
      }
    }

    @media (max-width:420px) {
      .nav-cta span {
        display: none;
      }
    }

    /* HERO */
    .hero {
      padding: 72px 0 56px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(250, 115, 67, .25);
    }

    .identity-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .identity-name {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .identity-role {
      font-size: 15px;
      font-weight: 600;
      color: var(--swift);
    }

    .hero-title {
      margin-top: 36px;
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .hero-title em {
      font-style: normal;
      color: var(--swift);
      display: block;
    }

    .summary {
      max-width: 660px;
      margin-top: 22px;
      font-size: 17px;
      color: var(--ink-soft);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
    }

    a.chip:hover {
      border-color: var(--swift-tint-line);
    }

    .chip svg {
      width: 15px;
      height: 15px;
      color: var(--swift);
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform .15s, box-shadow .15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--ink) !important;
      border: 1px solid var(--line);
    }

    /* SECTIONS */
    .band {
      padding: 64px 0;
    }

    .band.raised {
      background: var(--raised);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .section-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--swift);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
      display: block;
    }

    .section-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tags li {
      font-size: 12.5px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 7px;
      background: var(--swift-tint);
      color: var(--swift-strong);
      border: 1px solid var(--swift-tint-line);
    }

    /* Technologies */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .skill-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .skill-title svg {
      width: 20px;
      height: 20px;
      color: var(--swift);
    }

    /* Experience timeline */
    .timeline {
      display: grid;
      gap: 16px;
    }

    .job {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 20px;
    }

    .job-period {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--swift);
      padding-top: 24px;
    }

    .job-role {
      font-size: 18px;
      font-weight: 700;
    }

    .job-org {
      font-size: 14px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .points {
      margin-top: 12px;
      display: grid;
      gap: 6px;
    }

    .points li {
      position: relative;
      padding-left: 18px;
      font-size: 14.5px;
    }

    .points li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: .62em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--swift);
    }

    /* Projects */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .project-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .project-icon {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .project-name {
      font-size: 17px;
      font-weight: 700;
    }

    .project-meta {
      font-size: 13px;
      color: var(--ink-soft);
    }

    .project-points {
      margin: 12px 0;
    }

    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-top: 12px;
      font-size: 13.5px;
      font-weight: 600;
    }

    .project-links a {
      color: var(--swift-strong);
    }

    .project-links a:hover {
      text-decoration: underline;
    }

    /* Credentials */
    .cred-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .column-label {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .column-label svg {
      width: 18px;
      height: 18px;
      color: var(--swift);
    }

    .cred-list li {
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .cred-title {
      font-size: 14px;
      font-weight: 600;
    }

    .cred-detail {
      font-size: 13px;
      color: var(--ink-soft);
    }

    .consent {
      margin-top: 36px;
      font-size: 12px;
      color: var(--ink-soft);
      max-width: 760px;
    }

    footer {
      padding: 36px 0 44px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    @media (max-width:820px) {

      .skill-grid,
      .cred-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .project-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width:560px) {
      .wrap {
        padding: 0 16px;
      }

      .hero {
        padding: 48px 0 40px;
      }

      .skill-grid,
      .cred-grid {
        grid-template-columns: 1fr;
      }

      .job {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .job-period {
        padding-top: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    .print-only {
      display: none;
    }

    /* ============ PRINT: one A4 page, always light ============ */
    @page {
      size: A4;
      margin: 0;
    }

    @media print {

      html,
      html[data-theme="dark"] {
        --bg: #FFFFFF;
        --surface: #F4F4F2;
        --ink: #111113;
        --ink-soft: #55555C;
        --line: #E3E3E0;
        --swift: #E8622F;
        --swift-strong: #C2491B;
        --swift-tint: #FFF1EA;
        --swift-tint-line: #FFDCC7;
        --raised: #FFFFFF;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      body {
        width: 210mm;
        height: 296mm;
        padding: 9mm 11mm 7mm;
        display: flex;
        flex-direction: column;
        font-size: 8pt;
        line-height: 1.32;
        background: #fff;
        overflow: hidden;
      }

      nav,
      footer,
      .hero-actions,
      .screen-only {
        display: none !important;
      }

      .print-only {
        display: inline-flex;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .wrap {
        max-width: none;
        padding: 0;
      }

      .hero {
        padding: 0;
      }

      .identity {
        gap: 12px;
      }

      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        box-shadow: none;
      }

      .identity-eyebrow {
        display: none;
      }

      .monogram {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #FF9B6A 0%, #FA7343 45%, #D9451A 100%);
        color: #fff;
        font-family: 'Inter', sans-serif;
        font-size: 15pt;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .identity-name {
        font-size: 16pt;
      }

      .identity-role {
        font-size: 10pt;
      }

      .hero-title {
        margin-top: 6px;
        font-size: 14pt;
      }

      .hero-title em {
        display: inline;
      }

      .summary {
        max-width: none;
        margin-top: 3px;
        font-size: 8.2pt;
      }

      .chips {
        gap: 5px;
        margin-top: 7px;
      }

      .chip {
        padding: 1px 7px;
        font-size: 7.3pt;
        gap: 4px;
        border: none;
        background: var(--surface);
      }

      .chip svg {
        width: 10px;
        height: 10px;
      }

      .band {
        padding: 0;
        margin-top: 7px;
        border: none !important;
      }

      .band:last-of-type {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .band:last-of-type>.wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .section-tag {
        display: none;
      }

      .section-title {
        font-family: 'Inter', sans-serif;
        font-size: 8.6pt;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--swift-strong);
        margin-bottom: 5px;
        padding-bottom: 3px;
        border-bottom: 1px solid var(--line);
      }

      .card {
        background: var(--surface);
        border: none;
        border-radius: 7px;
        padding: 5px 8px;
        break-inside: avoid;
      }

      .tags {
        gap: 3px;
      }

      .tags li {
        font-size: 6.9pt;
        padding: 0 4px;
        border-radius: 4px;
        border: none;
      }

      .skill-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }

      .skill-title {
        font-size: 8.6pt;
        margin-bottom: 4px;
        gap: 5px;
      }

      .skill-title svg {
        width: 11px;
        height: 11px;
      }

      .timeline {
        gap: 5px;
      }

      .job {
        grid-template-columns: 22mm 1fr;
        gap: 6px;
      }

      .job-period {
        font-size: 7.6pt;
        padding-top: 6px;
      }

      .job-role {
        font-size: 9pt;
      }

      .job-org {
        font-size: 7.6pt;
        margin-top: 0;
      }

      .points {
        margin-top: 3px;
        gap: 1px;
      }

      .points li {
        font-size: 7.9pt;
        padding-left: 11px;
      }

      .points li::before {
        width: 4px;
        height: 4px;
        left: 1px;
      }

      .project-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
      }

      .project-head {
        gap: 7px;
      }

      .project-icon {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }

      .project-name {
        font-size: 9pt;
      }

      .project-meta {
        font-size: 7.4pt;
      }

      .project-points {
        margin: 2px 0 2px;
      }

      .project-grid .card {
        position: relative;
      }

      .project-links {
        position: absolute;
        top: 5px;
        right: 8px;
        margin: 0 !important;
        font-size: 7.6pt;
        gap: 2px 10px;
      }

      .cred-grid {
        grid-template-columns: 1.5fr 1fr .7fr;
        gap: 12px;
      }

      .column-label {
        font-size: 8.4pt;
        margin-bottom: 2px;
      }

      .column-label svg {
        width: 11px;
        height: 11px;
      }

      .cred-list li {
        padding: 1.5px 0;
      }

      .cred-title,
      .cred-detail {
        display: inline;
      }

      .cred-detail::before {
        content: " · ";
      }

      .project-grid .tags {
        display: none;
      }

      .cred-title {
        font-size: 8.2pt;
      }

      .cred-detail {
        font-size: 7.6pt;
      }

      /* Consent sits at the bottom of the page. */
      .consent {
        margin-top: auto;
        padding-top: 6px;
        font-size: 6.6pt;
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <nav>
    <div class="wrap">
      <a href="./index.html" aria-label="Portfolio"><img src="./assets/avatar.jpg" alt="Marcin Jędrzejak"
          class="logo"></a>
      <div class="nav-links">
        <a href="./index.html" data-i18n="nav-portfolio">Portfolio</a>
        <a href="#skills" data-i18n="nav-skills">Technologie</a>
        <a href="#experience" data-i18n="nav-experience">Doświadczenie</a>
        <a href="#projects" data-i18n="nav-projects">Projekty</a>
      </div>
      <div class="nav-right">
        <button class="toggle-btn lang-btn" id="langToggle" aria-label="Switch language">EN</button>
        <button class="toggle-btn" id="themeToggle" aria-label="Switch theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none"></svg>
        </button>
        <a href="mailto:mjedrzejak@icloud.com" class="nav-cta">
          <svg viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 20h10c2.8 0 4.2 0 5.27-.545a5 5 0 0 0 2.185-2.185C22 16.2 22 14.8 22 12c0-1.994 0-3.278-.197-4.238m0 0-5.508 3.505c-1.557.99-2.335 1.486-3.171 1.678a5 5 0 0 1-2.248 0c-.836-.192-1.614-.688-3.171-1.678l-4.587-2.92c-.555-.352-.872-1.031-.573-1.617A5 5 0 0 1 4.73 4.545C5.8 4 7.2 4 10 4h4c2.8 0 4.2 0 5.27.545a5 5 0 0 1 2.185 2.185c.157.308.269.643.348 1.032ZM1 12h1m0 4h5" />
          </svg>
          <span data-i18n="nav-cta">Napisz do mnie</span>
        </a>
      </div>
    </div>
  </nav>

  <main>
    <header class="hero" id="top">
      <div class="wrap">
        <div class="identity">
          <img src="./assets/avatar.jpg" alt="" class="avatar screen-only">
          <span class="monogram print-only" aria-hidden="true">MJ</span>
          <div>
            <p class="identity-eyebrow">Curriculum Vitae</p>
            <p class="identity-name">Marcin Jędrzejak</p>
            <p class="identity-role">iOS Developer</p>
          </div>
        </div>
        <h1 class="hero-title" data-i18n="title"></h1>
        <p class="summary" data-i18n="profile"></p>
        <ul class="chips" id="contacts"></ul>
        <div class="hero-actions">
          <a class="btn btn-primary" id="pdfLink" href="./assets/cv/CV_Marcin_Jedrzejak_PL.pdf" download>
            <svg viewBox="0 0 24 24" fill="none">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v.6c0 1.344 0 2.016.262 2.53a2.4 2.4 0 0 0 1.048 1.048C5.824 21.44 6.496 21.44 7.84 21.44h8.32c1.344 0 2.016 0 2.53-.262a2.4 2.4 0 0 0 1.048-1.048C20 19.616 20 18.944 20 17.6V17" />
            </svg>
            <span data-i18n="download">Pobierz PDF</span>
          </a>

      }).join('');

      document.getElementById('credGrid').innerHTML =
        `<section><h3 class="column-label">${svg('award')}${esc(t.certLabel)}</h3>${credList(t.certs)}</section>` +
        `<section><h3 class="column-label">${svg('grad')}${esc(t.eduLabel)}</h3>${credList(t.edu)}</section>` +
        `<section><h3 class="column-label">${svg('lang')}${esc(t.langLabel)}</h3>${credList(t.langs)}</section>`;
    }

    /* ---- THEME (shared key with the home page) ---- */
    const themeBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const next = theme === 'dark' ? 'light' : 'dark';
      themeIcon.innerHTML = ICON[next === 'dark' ? 'moon' : 'sun'];
      themeBtn.setAttribute('aria-label', `Switch to ${next} theme`);
      try { localStorage.setItem('mj-theme', theme); } catch (e) { }
    }
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    themeBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* ---- LANGUAGE (shared key with the home page; ?lang=en|pl overrides) ---- */
    const langBtn = document.getElementById('langToggle');
    function applyLang(lang, persist = true) {
      document.documentElement.setAttribute('lang', lang);
      render(lang);
      const next = lang === 'pl' ? 'en' : 'pl';
      langBtn.textContent = next.toUpperCase();
      langBtn.setAttribute('aria-label', `Switch to ${next === 'pl' ? 'Polish' : 'English'}`);
      if (persist) {
        try { localStorage.setItem('mj-lang', lang); } catch (e) { }
      }
    }
    const urlLang = new URLSearchParams(location.search).get('lang');
    let savedLang = null;
    try { savedLang = localStorage.getItem('mj-lang'); } catch (e) { }
    const startLang = CV[urlLang] ? urlLang : (CV[savedLang] ? savedLang : 'pl');
    applyLang(startLang, !CV[urlLang]);
    langBtn.addEventListener('click', () => {
      applyLang(document.documentElement.getAttribute('lang') === 'pl' ? 'en' : 'pl');
    });
  </script>
</body>

</html>
